<main class="main">
  <p
    v-if="threadsLoading"
    class="muted threads-loading"
    aria-busy="true"
  >
    loading threads<span class="app-loading__dots" aria-hidden="true"><span class="app-loading__dot">.</span><span class="app-loading__dot">.</span><span class="app-loading__dot">.</span></span>
  </p>
  <template v-else>
    <section class="band band--browse">
      <p v-if="!unjoinedThreads.length" class="muted">
        <template v-if="!allThreads.length">no threads yet.</template>
        <template v-else>
          you've joined every class thread.
          <button type="button" class="linkish" @click="goMyThreads">
            my threads
          </button>
        </template>
      </p>
      <ul v-else class="cards cards--browse">
        <li v-for="t in unjoinedThreads" :key="t.url" class="card card--browse">
          <div class="card-body">
            <div class="topic">
              <span
                class="topic__text"
                :title="threadTopicDisplay(t)"
                >{{ threadTopicDisplay(t) }}</span>
              <span v-if="isPrivateThread(t)" class="badge-private"
                >private thread</span
              >
            </div>
            <div class="meta">
              <span class="owner-label">owner:</span>
              <actor-name
                :actor="t.actor"
                :is-me="isMe(t.actor)"
                :display-name="myDisplayName"
              ></actor-name>
            </div>
            <thread-card-preview :thread="t"></thread-card-preview>
          </div>
          <div class="card-actions">
            <button
              type="button"
              class="btn small"
              :disabled="joining.has(t.value.channel)"
              @click="joinThread(t)"
            >
              {{ joining.has(t.value.channel) ? "..." : "join" }}
            </button>
          </div>
        </li>
      </ul>
    </section>
  </template>
</main>
