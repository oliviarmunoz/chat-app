<main class="main">
  <p
    v-if="threadsLoading"
    class="muted threads-loading"
    aria-busy="true"
  >
    loading threads<span class="app-loading__dots" aria-hidden="true"><span class="app-loading__dot">.</span><span class="app-loading__dot">.</span><span class="app-loading__dot">.</span></span>
  </p>
  <template v-else>
    <section class="band band--mine">
      <h2>welcome, {{ myDisplayName }}!</h2>
      <p v-if="!joinedThreads.length" class="muted">
        <template v-if="!allThreads.length">no class threads yet.</template>
        <template v-else>
          you haven't joined any threads.
          <button type="button" class="linkish" @click="goClassThreads">
            browse class threads
          </button>
        </template>
      </p>
      <ul v-else class="cards cards--mine">
        <li v-for="t in joinedThreads" :key="t.url" class="card card--mine">
          <div class="card-body">
            <div class="topic">
              <span
                class="topic__text"
                :title="threadTopicDisplay(t)"
                >{{ threadTopicDisplay(t) }}</span>
              <span v-if="isPrivateThread(t)" class="badge-private"
                >private thread</span
              >
            </div>
            <div class="meta">
              <span class="owner-label">owner:</span>
              <actor-name
                :actor="t.actor"
                :is-me="isMe(t.actor)"
                :display-name="myDisplayName"
              ></actor-name>
            </div>
            <thread-card-preview :thread="t"></thread-card-preview>
          </div>
          <div class="card-actions">
            <button type="button" class="btn small primary" @click="openThread(t)">
              open
            </button>
          </div>
        </li>
      </ul>
    </section>
    <section v-if="unjoinedThreads.length" class="band band--browse-reminder">
      <h2>more in the class</h2>
      <p class="muted band--browse-reminder__text">
        {{ unjoinedThreads.length }} thread{{
          unjoinedThreads.length !== 1 ? "s" : ""
        }}
        you haven't joined —
        <button type="button" class="linkish" @click="goClassThreads">browse</button>
      </p>
    </section>
  </template>
</main>
