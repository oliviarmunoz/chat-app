<main class="main thread-main">
  <section
    v-if="threadParticipantsPanelVisible"
    class="thread-panel thread-roster"
    aria-label="People in this thread"
  >
    <h2 class="thread-roster__title">in this thread:</h2>
    <ul class="thread-roster__list">
      <li
        v-for="p in threadParticipants"
        :key="p.id"
        class="thread-roster__chip"
      >
        <actor-name
          :actor="p.actor"
          :is-me="isMe(p.actor)"
          :display-name="myDisplayName"
          link-profile
          @open-profile="goProfileForActor"
        ></actor-name>
      </li>
    </ul>
  </section>
  <p
    v-if="timelineLoading"
    class="muted messages-loading"
    aria-busy="true"
  >
    loading messages<span class="app-loading__dots" aria-hidden="true"><span class="app-loading__dot">.</span><span class="app-loading__dot">.</span><span class="app-loading__dot">.</span></span>
  </p>
  <div v-else class="thread-panel">
    <div class="thread-actions">
      <button
        v-if="isActiveThreadOwner"
        type="button"
        class="btn small danger"
        :disabled="
          deletingThread.has(activeThreadChannel) ||
          leaving.has(activeThreadChannel)
        "
        @click="openDeleteThreadDialog"
      >
        {{
          deletingThread.has(activeThreadChannel)
            ? "..."
            : "delete thread"
        }}
      </button>
      <button
        v-else
        type="button"
        class="btn small danger"
        :disabled="
          leaving.has(activeThreadChannel) ||
          deletingThread.has(activeThreadChannel)
        "
        @click="leaveCurrentThread"
      >
        {{ leaving.has(activeThreadChannel) ? "..." : "leave thread" }}
      </button>
    </div>
    <chat-timeline-list ref="timelineEl"></chat-timeline-list>
    <form class="compose" @submit.prevent="sendMessage">
      <input
        ref="composeInput"
        v-model="draft"
        type="text"
        placeholder="write a message..."
        :disabled="sending"
      />
      <button
        type="submit"
        class="btn primary"
        :disabled="!draft.trim() || sending"
      >
        {{ sending ? "sending..." : "send" }}
      </button>
    </form>
  </div>
  <div
    v-if="deleteThreadConfirmOpen"
    class="confirm-backdrop"
    role="presentation"
    @click.self="cancelDeleteThreadDialog"
  >
    <div
      class="confirm-dialog form-card"
      role="dialog"
      aria-modal="true"
      aria-labelledby="confirm-delete-thread-title"
      aria-describedby="confirm-delete-thread-desc"
    >
      <p id="confirm-delete-thread-title" class="confirm-dialog__title">
        delete thread?
      </p>
      <p id="confirm-delete-thread-desc" class="muted confirm-dialog__hint">
        this removes the thread for everyone and cannot be undone.
      </p>
      <div class="form-actions confirm-dialog__actions">
        <button
          type="button"
          class="btn muted-btn"
          :disabled="deletingThread.has(activeThreadChannel)"
          @click="cancelDeleteThreadDialog"
        >
          cancel
        </button>
        <button
          type="button"
          class="btn danger"
          :disabled="deletingThread.has(activeThreadChannel)"
          @click="confirmDeleteThreadAsOwner"
        >
          {{
            deletingThread.has(activeThreadChannel)
              ? "deleting..."
              : "delete"
          }}
        </button>
      </div>
    </div>
  </div>
</main>
