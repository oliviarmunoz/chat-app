<main class="main thread-main">
  <p
    v-if="timelineLoading"
    class="muted messages-loading"
    aria-busy="true"
  >
    loading messages<span class="app-loading__dots" aria-hidden="true"><span class="app-loading__dot">.</span><span class="app-loading__dot">.</span><span class="app-loading__dot">.</span></span>
  </p>
  <div v-else class="thread-panel">
    <div class="thread-actions">
      <button
        v-if="isActiveThreadOwner"
        type="button"
        class="btn small danger"
        :disabled="
          deletingThread.has(activeThreadChannel) ||
          leaving.has(activeThreadChannel)
        "
        @click="openDeleteThreadDialog"
      >
        {{
          deletingThread.has(activeThreadChannel)
            ? "..."
            : "delete thread"
        }}
      </button>
      <button
        v-else
        type="button"
        class="btn small danger"
        :disabled="
          leaving.has(activeThreadChannel) ||
          deletingThread.has(activeThreadChannel)
        "
        @click="leaveCurrentThread"
      >
        {{ leaving.has(activeThreadChannel) ? "..." : "leave thread" }}
      </button>
    </div>
    <ul class="timeline">
      <li
        v-for="item in timeline"
        :key="item.url"
        :class="
          item.kind === 'join' || item.kind === 'leave' ? 'sys' : 'msg'
        "
      >
        <template v-if="item.kind === 'join'">
          &lt; —-
          <actor-name
            :actor="item.actor"
            :is-me="isMe(item.actor)"
            :display-name="myDisplayName"
            link-profile
            @open-profile="goProfileForActor"
          ></actor-name>
          joined the thread! -— &gt;
        </template>
        <template v-else-if="item.kind === 'leave'">
          &lt; —- {{ myDisplayName }} has left the thread! -— &gt;
        </template>
        <template v-else>
          <div class="msg-row">
            <span
              v-if="ownMessagePendingDelete(item)"
              class="msg-body msg-body--pending-delete"
            >
              <span class="msg-deleted-note">you deleted this message.</span>
              <span class="msg-delete-undo-row">
                <button
                  type="button"
                  class="btn small msg-delete-undo"
                  @click="undoOwnMessageDelete(item)"
                >
                  undo
                </button>
                <span
                  class="msg-delete-countdown"
                  :aria-label="
                    ownMessageDeleteSecondsLeft(item) +
                    ' seconds until permanent delete'
                  "
                  >{{ ownMessageDeleteSecondsLeft(item) }}s</span
                >
              </span>
            </span>
            <span
              v-else-if="isMe(item.actor) && deletingMessages.has(item.url)"
              class="msg-body msg-body--pending-delete"
            >
              <span class="msg-deleted-note">deleting...</span>
            </span>
            <span v-else class="msg-body">
              <actor-name
                :actor="item.actor"
                :is-me="isMe(item.actor)"
                :display-name="myDisplayName"
                bold
                link-profile
                @open-profile="goProfileForActor"
              ></actor-name
              >: {{ item.value.content }}
            </span>
            <button
              v-if="
                isMe(item.actor) &&
                !ownMessagePendingDelete(item) &&
                !deletingMessages.has(item.url)
              "
              type="button"
              class="btn small danger msg-delete msg-delete-icon"
              :disabled="deletingMessages.has(item.url)"
              aria-label="Delete message"
              @click="deleteOwnMessage(item)"
            >
              <span
                v-if="deletingMessages.has(item.url)"
                class="msg-delete-loading"
                aria-hidden="true"
                >deleting ...</span
              >
              <img
                v-else
                src="images/delete.png"
                alt=""
                class="msg-delete__pic"
                width="28"
                height="28"
              />
            </button>
          </div>
        </template>
      </li>
    </ul>
    <form class="compose" @submit.prevent="sendMessage">
      <input
        v-model="draft"
        type="text"
        placeholder="write a message..."
        :disabled="sending"
      />
      <button
        type="submit"
        class="btn primary"
        :disabled="!draft.trim() || sending"
      >
        {{ sending ? "sending..." : "send" }}
      </button>
    </form>
  </div>
  <div
    v-if="deleteThreadConfirmOpen"
    class="confirm-backdrop"
    role="presentation"
    @click.self="cancelDeleteThreadDialog"
  >
    <div
      class="confirm-dialog form-card"
      role="dialog"
      aria-modal="true"
      aria-labelledby="confirm-delete-thread-title"
      aria-describedby="confirm-delete-thread-desc"
    >
      <p id="confirm-delete-thread-title" class="confirm-dialog__title">
        delete thread?
      </p>
      <p id="confirm-delete-thread-desc" class="muted confirm-dialog__hint">
        this removes the thread for everyone and cannot be undone.
      </p>
      <div class="form-actions confirm-dialog__actions">
        <button
          type="button"
          class="btn muted-btn"
          :disabled="deletingThread.has(activeThreadChannel)"
          @click="cancelDeleteThreadDialog"
        >
          cancel
        </button>
        <button
          type="button"
          class="btn danger"
          :disabled="deletingThread.has(activeThreadChannel)"
          @click="confirmDeleteThreadAsOwner"
        >
          {{
            deletingThread.has(activeThreadChannel)
              ? "deleting..."
              : "delete"
          }}
        </button>
      </div>
    </div>
  </div>
</main>
