<main class="main">
  <div class="form-card">
    <label class="field privacy-field">
      <div class="privacy-field__row">
        <div class="privacy-field__label-row">
          <span class="field-label-with-tip">privacy settings</span>
          <span class="field-tip">
            <button
              type="button"
              class="field-tip__btn"
              aria-label="Privacy: Public threads are listed for the whole class—choose a topic and anyone can join and post. Private threads are only visible to you and the Graffiti handles you invite; only those people can see or post."
            >
              ?
            </button>
          </span>
          <span class="field-tip__bubble">
            <strong>public</strong> — shown in the class thread list with your topic. anyone in the class can open it and post.<br /><br />
            <strong>private</strong> — not shown in the class thread list. only you and the people you invite can see or post; others will not see this thread.
          </span>
        </div>
      </div>
      <select v-model="newPrivacy">
        <option value="everyone">public</option>
        <option value="private">private</option>
      </select>
    </label>
    <label v-if="newPrivacy === 'everyone'" class="field">
      <span>topic:</span>
      <input
        v-model="newTopic"
        type="text"
        placeholder="set a topic for the thread"
      />
    </label>
    <label v-if="newPrivacy === 'private'" class="field">
      <span>invite handles:</span>
      <textarea
        v-model="newInvites"
        rows="3"
        placeholder="graffiti handles, one per line or comma-separated"
      ></textarea>
    </label>
    <p v-if="createThreadError" class="create-error">{{ createThreadError }}</p>
    <label class="field">
      <span>message (optional):</span>
      <textarea
        v-model="newOptionalMessage"
        placeholder="send the first message in the thread"
      ></textarea>
    </label>
  </div>
  <div class="form-actions">
    <button
      type="button"
      class="btn primary"
      :disabled="
        creating ||
        (newPrivacy === 'everyone' && !newTopic.trim()) ||
        (newPrivacy === 'private' && !newInvites.trim())
      "
      @click="createThread"
    >
      {{ creating ? "creating..." : "create thread" }}
    </button>
    <button type="button" class="btn danger" @click="goHome">cancel</button>
  </div>
</main>
