<main class="main">
  <div class="form-card">
    <label class="field privacy-field">
      <div class="privacy-field__row">
        <div class="privacy-field__label-row">
          <span class="field-label-with-tip">thread type</span>
          <span class="field-tip">
            <button
              type="button"
              class="field-tip__btn"
              aria-label="Thread types: Public is listed for the whole class with a topic. Private is invite-only by handle. Quick add is a private group built from classmates’ profile toggles (open to study or open to questions), with a topic you choose."
            >
              ?
            </button>
          </span>
          <span class="field-tip__bubble">
            <strong>public</strong> — listed in the class thread list with your
            topic. anyone in the class can open it and post.<br /><br />
            <strong>private</strong> — only you and the handles you type below can see or post in this thread.<br /><br />
            <strong>quick add</strong> — quickly create a private group thread from classmates’ profile preferences (open to study or open to answer questions).
          </span>
        </div>
      </div>
      <select v-model="newPrivacy">
        <option value="everyone">public</option>
        <option value="private">private</option>
        <option value="quickAdd">quick add</option>
      </select>
    </label>
    <label v-if="newPrivacy === 'everyone'" class="field">
      <span>topic:</span>
      <input
        v-model="newTopic"
        type="text"
        :maxlength="threadTopicMaxChars"
        placeholder="set a topic for the thread"
      />
    </label>
    <label v-if="newPrivacy === 'private'" class="field">
      <span>invite handles:</span>
      <textarea
        v-model="newInvites"
        rows="3"
        placeholder="graffiti handles, one per line or comma-separated"
      ></textarea>
    </label>
    <template v-if="newPrivacy === 'quickAdd'">
      <label class="field">
        <span>invite from profiles:</span>
        <select v-model="newQuickAddGroup">
          <option value="study">
            everyone open to study ({{ studyBuddyInviteCount }})
          </option>
          <option value="questions">
            everyone open to questions ({{ questionBuddyInviteCount }})
          </option>
        </select>
      </label>
      <label class="field">
        <span>topic:</span>
        <input
          v-model="newTopic"
          type="text"
          :maxlength="threadTopicMaxChars"
          placeholder="name this group thread (shown to invitees)"
        />
      </label>
      <div class="invite-quick-add" aria-live="polite">
        <p
          v-if="createInviteProfilesLoading"
          class="invite-quick-add__hint muted"
        >
          loading profiles…
        </p>
      </div>
    </template>
    <p v-if="createThreadError" class="create-error">{{ createThreadError }}</p>
    <label class="field">
      <span>message (optional):</span>
      <textarea
        v-model="newOptionalMessage"
        placeholder="send the first message in the thread"
      ></textarea>
    </label>
  </div>
  <div class="form-actions">
    <button
      type="button"
      class="btn primary"
      :disabled="
        creating ||
        (newPrivacy === 'everyone' && !newTopic.trim()) ||
        (newPrivacy === 'private' && !newInvites.trim()) ||
        (newPrivacy === 'quickAdd' &&
          (!newTopic.trim() ||
            createInviteProfilesLoading ||
            (newQuickAddGroup === 'study' && studyBuddyInviteCount === 0) ||
            (newQuickAddGroup === 'questions' && questionBuddyInviteCount === 0)))
      "
      @click="createThread"
    >
      {{ creating ? "creating..." : "create thread" }}
    </button>
    <button type="button" class="btn danger" @click="goHome">cancel</button>
  </div>
</main>
