<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>class threads</title>
    <script type="importmap">
      {
        "imports": {
          "vue": "https://cdn.jsdelivr.net/npm/vue@3.5.32/dist/vue.esm-browser.js",
          "vue-router": "https://cdn.jsdelivr.net/npm/vue-router@4.5.1/dist/vue-router.esm-browser.prod.js",
          "@graffiti-garden/implementation-local": "https://cdn.jsdelivr.net/npm/@graffiti-garden/implementation-local@1.2.0/dist/browser/index.js",
          "@graffiti-garden/implementation-decentralized": "https://cdn.jsdelivr.net/npm/@graffiti-garden/implementation-decentralized@0.0.9/dist/browser/index.js",
          "@graffiti-garden/wrapper-vue": "https://cdn.jsdelivr.net/npm/@graffiti-garden/wrapper-vue@1.2.2/dist/browser/plugin.mjs"
        }
      }
    </script>
    <script src="index.js" type="module"></script>
    <link rel="stylesheet" href="app.css" />
  </head>
  <body>
    <div id="app"> 
      <p class="app-loading" aria-busy="true">
        loading<span class="app-loading__dots" aria-hidden="true"
          ><span class="app-loading__dot">.</span
          ><span class="app-loading__dot">.</span
          ><span class="app-loading__dot">.</span></span
        >
      </p>
    </div>
    <template id="shell-template">
      <div
        class="shell"
        v-if="routeName === 'login' || !$graffitiSession.value"
      >
        <p class="muted">login to see threads! </p>
        <button type="button" class="btn primary" @click="$graffiti.login()">
          login
        </button>
      </div>

      <div class="shell" v-else>
        <header class="top">
          <div class="top-nav">
            <div class="top-left">
              <button
                type="button"
                class="icon-btn icon-btn--toolbar"
                aria-label="My profile"
                @click="goProfile"
              >
                <svg
                  class="icon-btn__svg"
                  xmlns="http://www.w3.org/2000/svg"
                  fill="none"
                  viewBox="0 0 24 24"
                  stroke-width="1.6"
                  stroke="currentColor"
                  aria-hidden="true"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z"
                  />
                </svg>
              </button>
            </div>
            <div class="top-title">
              <h1>6.4500 threads</h1>
              <p v-if="view === 'classThreads'" class="sub">class threads</p>
              <p v-else-if="view === 'create'" class="sub">create new thread</p>
              <p v-else-if="view === 'myThreads'" class="sub">my threads</p>
              <p v-else-if="view === 'profile'" class="sub">
                {{ profileShellTitle }}
              </p>
              <p v-else-if="view === 'thread'" class="sub sub--thread">
                <span class="sub--thread__label"><strong>topic</strong>:</span>
                <span class="sub--thread__topic"
                  >{{ activeThreadTitle || "thread" }}</span
                >
              </p>
            </div>
            <div class="top-right">
              <button
                v-if="view === 'classThreads' || view === 'myThreads'"
                type="button"
                class="icon-btn icon-btn--toolbar"
                aria-label="Create thread"
                @click="goCreate"
              >
                <svg
                  class="icon-btn__svg"
                  xmlns="http://www.w3.org/2000/svg"
                  fill="none"
                  viewBox="0 0 24 24"
                  stroke-width="1.6"
                  stroke="currentColor"
                  aria-hidden="true"
                >
                  <path stroke-linecap="round" d="M12 4.5v15m7.5-7.5h-15" />
                </svg>
              </button>
              <button
                v-if="view === 'classThreads' || view === 'profile' || view === 'create' || view === 'thread'"
                type="button"
                class="icon-btn icon-btn--toolbar"
                aria-label="My threads"
                @click="goHome"
              >
                <svg
                  class="icon-btn__svg"
                  xmlns="http://www.w3.org/2000/svg"
                  fill="none"
                  viewBox="0 0 24 24"
                  stroke-width="1.6"
                  stroke="currentColor"
                  aria-hidden="true"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M2.25 12l8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21h8.25"
                  />
                </svg>
              </button>
              <button
                v-if="view !== 'classThreads' && view !== 'profile' && view !== 'create' && view !== 'thread'"
                type="button"
                class="icon-btn icon-btn--toolbar"
                aria-label="Browse class threads"
                @click="goClassThreads"
              >
                <svg
                  class="icon-btn__svg"
                  xmlns="http://www.w3.org/2000/svg"
                  fill="none"
                  viewBox="0 0 24 24"
                  stroke-width="1.6"
                  stroke="currentColor"
                  aria-hidden="true"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M4.26 10.147a60.436 60.436 0 0 0-.491 6.347A48.627 48.627 0 0 1 12 20.904a48.627 48.627 0 0 1 8.232-4.41 60.46 60.46 0 0 0-.491-6.347m-15.482 0a50.59 50.59 0 0 0-2.658-.813A59.895 59.895 0 0 1 12 3.493a59.895 59.895 0 0 1 10.399 5.84 60.06 60.06 0 0 0-2.658.814m-15.482 0A50.617 50.617 0 0 1 12 13.489a50.702 50.702 0 0 1 7.83-3.24"
                  />
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M12 20.25v-8.911"
                  />
                </svg>
              </button>
            </div>
          </div>
        </header>
        <router-view />
      </div>
    </template>
  </body>
</html>
